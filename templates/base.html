<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Heritage Archive{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('index') }}">Heritage Archive</a>
<nav><a href="{{ url_for('index') }}">Browse</a><a class="btn" href="{{ url_for('upload') }}">Add material</a></nav></header>
<main>{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
